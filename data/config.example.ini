# $XDG_CONFIG_HOME/junk-drawer/config.ini  (usually ~/.config/junk-drawer/config.ini)
# Every key is optional. Restart Junk Drawer to apply changes.
# The view, sort, hidden files, sidebar and zoom are remembered in $XDG_STATE_HOME/junk-drawer/state.ini,
# which overrides the matching keys here. Keybindings live in keybindings.ini.

[appearance]
# latte | frappe | macchiato | mocha, or gtk to use the GTK theme's colours and accent
flavor = mocha
# rosewater flamingo pink mauve red maroon peach yellow green teal sky sapphire blue lavender
# (ignored with flavor = gtk)
accent = mauve
# Window background alpha, 0.0 – 1.0
opacity = 0.85

[view]
# icons | details
default = icons
show-hidden = false
# Show the current folder's path above the files
show-path = true
# Show the sidebar of places, bookmarks and volumes (F9 toggles it per window)
show-sidebar = true
# Show thumbnails of images, videos, PDFs and so on in place of icons
show-thumbnails = true
# Line under each name in the icon view: size | modified | type | permissions | none
# (size shows item counts for folders)
grid-caption = size
# Icon sizes in pixels. Nautilus zoom levels: 48 64 96 168 256 (grid), 16 32 64 (list).
icon-size = 96
list-icon-size = 32
