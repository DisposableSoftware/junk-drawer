# $XDG_CONFIG_HOME/junk-drawer/config.ini  (usually ~/.config/junk-drawer/config.ini)
# Every key is optional. Restart Junk Drawer to apply changes.

[appearance]
# latte | frappe | macchiato | mocha, or gtk to use the GTK theme's colours and accent
flavor = mocha
# rosewater flamingo pink mauve red maroon peach yellow green teal sky sapphire blue lavender
# (ignored with flavor = gtk)
accent = mauve
# Window background alpha, 0.0 – 1.0
opacity = 0.85

[view]
# icons | details
default = icons
show-hidden = false
# Show the current folder's path above the files
show-path = true
# Show the sidebar of places, bookmarks and volumes (F9 toggles it per window)
show-sidebar = true
# Show thumbnails of images, videos, PDFs and so on in place of icons
show-thumbnails = true
# Line under each name in the icon view: size | modified | type | permissions | none
# (size shows item counts for folders)
grid-caption = size
# Icon sizes in pixels. Nautilus zoom levels: 48 64 96 168 256 (grid), 16 32 64 (list).
icon-size = 96
list-icon-size = 32

[keybindings]
# GTK accelerator syntax: <Ctrl> <Shift> <Alt> <Super> + key name (see `wev` or GDK key names).
# Separate several bindings with ';'. Leave a value empty to unbind. Defaults shown.
# Keys without Ctrl/Alt/Super (q, space, Delete…) are ignored while typing in a text field.
new-window = <Ctrl>n
close-window = <Ctrl>w;q
quit = <Ctrl>q
open = Return;KP_Enter;space
rename = F2
view-icons = <Ctrl>1
view-details = <Ctrl>2
toggle-hidden = <Ctrl>h
go-up = <Alt>Up;BackSpace
go-back = <Alt>Left
go-forward = <Alt>Right
go-home = <Alt>Home
reload = F5;<Ctrl>r
select-all = <Ctrl>a
unselect-all = Escape
copy = <Ctrl>c
cut = <Ctrl>x
paste = <Ctrl>v
trash = Delete
delete = <Shift>Delete
new-folder = <Ctrl><Shift>n
open-with =
properties = <Ctrl>i;<Alt>Return
context-menu = Menu;<Shift>F10
zoom-in = <Ctrl>plus;<Ctrl>equal;<Ctrl>KP_Add
zoom-out = <Ctrl>minus;<Ctrl>KP_Subtract
zoom-reset = <Ctrl>0;<Ctrl>KP_0
location = <Ctrl>l
toggle-sidebar = F9
add-bookmark = <Ctrl>d
sort-by-name =
sort-by-size =
sort-by-modified =
sort-by-type =
sort-reversed =
show-help = question
