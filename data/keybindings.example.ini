# $XDG_CONFIG_HOME/junk-drawer/keybindings.ini  (usually ~/.config/junk-drawer/keybindings.ini)
# Every binding is optional: one left out keeps its default keys. Restart Junk Drawer to apply changes.

[keybindings]
# GTK accelerator syntax: <Ctrl> <Shift> <Alt> <Super> + key name (see `wev` or GDK key names).
# Separate several bindings with ';'. Leave a value empty to unbind. Defaults shown.
# Keys without Ctrl/Alt/Super (space, Delete…) are ignored while typing in a text field.
new-window = <Ctrl>n
close-window = <Ctrl>w
quit = <Ctrl>q
open = Return;KP_Enter;space
rename = F2
view-icons = <Ctrl>1
view-details = <Ctrl>2
toggle-hidden = <Ctrl>h
go-up = <Alt>Up;BackSpace
go-back = <Alt>Left
go-forward = <Alt>Right
go-home = <Alt>Home
reload = F5;<Ctrl>r
select-all = <Ctrl>a
unselect-all = Escape
copy = <Ctrl>c
cut = <Ctrl>x
paste = <Ctrl>v
trash = Delete
trash-now = <Ctrl>Delete
delete = <Shift>Delete
new-folder = <Ctrl><Shift>n
open-with =
properties = <Ctrl>i;<Alt>Return
context-menu = Menu;<Shift>F10
zoom-in = <Ctrl>plus;<Ctrl>equal;<Ctrl>KP_Add
zoom-out = <Ctrl>minus;<Ctrl>KP_Subtract
zoom-reset = <Ctrl>0;<Ctrl>KP_0
location = <Ctrl>l
toggle-sidebar = F9
add-bookmark = <Ctrl>d
sort-by-name =
sort-by-size =
sort-by-modified =
sort-by-type =
sort-reversed =
show-help = question
